# nfpm configuration for the .deb and .rpm packages. Driven by build-packages.sh, which sets the
# BOLT_* environment variables, stages the build in artifacts/stage/ and runs nfpm from the repository root.
# nfpm expands ${VAR} in scalar fields (version, prerelease) but NOT in contents src paths.
name: bolt
arch: amd64
platform: linux
version: ${BOLT_VERSION}
prerelease: ${BOLT_PRERELEASE}
release: 1
section: admin
priority: optional
maintainer: David Kozma <k0zi@outlook.com>
vendor: k0zi
homepage: https://github.com/k0zi/Bolt
license: MIT
description: |-
  Software store for GitHub, GitLab and Codeberg releases
  Bolt installs packages from the releases of GitHub, GitLab and Codeberg (Forgejo/Gitea)
  repositories with the system's own package manager (apt, dnf or zypper).

contents:
  # type: tree keeps the directory structure (a trailing-slash glob flattens subfolders and collides).
  - src: artifacts/stage/app
    dst: /usr/lib/bolt
    type: tree
  - src: /usr/lib/bolt/Bolt
    dst: /usr/bin/bolt
    type: symlink
  - src: artifacts/stage/bolt.desktop
    dst: /usr/share/applications/bolt.desktop
  - src: artifacts/stage/bolt.png
    dst: /usr/share/icons/hicolor/512x512/apps/bolt.png
  # ── licence: Debian policy location vs. RPM %license ──
  - src: artifacts/stage/LICENSE
    dst: /usr/share/doc/bolt/copyright
    packager: deb
  - src: artifacts/stage/LICENSE
    dst: /usr/share/licenses/bolt/LICENSE
    packager: rpm
    type: license

# Self-contained .NET build: only native libraries of the base system are needed.
# Hard: .NET runtime (C++ runtime, zlib, ICU), OpenSSL (HTTPS to the forges), Avalonia/X11 + Skia (fontconfig).
# Recommended: OpenGL/EGL/Vulkan (Skia falls back to software rendering), GTK 3 (file dialogs), pkexec (installing).
overrides:
  deb:
    depends:
      - libc6
      - libgcc-s1
      - libstdc++6
      - zlib1g
      - libicu80 | libicu79 | libicu78 | libicu77 | libicu76 | libicu75 | libicu74 | libicu73 | libicu72 | libicu71 | libicu70 | libicu67
      - libssl3t64 | libssl3 | libssl1.1
      - libx11-6
      - libice6
      - libsm6
      - libxcursor1
      - libxext6
      - libxfixes3
      - libxi6
      - libxrandr2
      - libfontconfig1
    recommends:
      - libgl1
      - libegl1
      - libvulkan1
      - libgtk-3-0t64 | libgtk-3-0
      - pkexec | policykit-1
  rpm:
    # Shared-library capabilities have the same names on Fedora/RHEL and openSUSE, unlike the package names.
    depends:
      - libstdc++.so.6()(64bit)
      - libz.so.1()(64bit)
      - (libicuuc.so.80()(64bit) or libicuuc.so.79()(64bit) or libicuuc.so.78()(64bit) or libicuuc.so.77()(64bit) or libicuuc.so.76()(64bit) or libicuuc.so.75()(64bit) or libicuuc.so.74()(64bit) or libicuuc.so.73()(64bit) or libicuuc.so.72()(64bit) or libicuuc.so.71()(64bit) or libicuuc.so.70()(64bit) or libicuuc.so.69()(64bit) or libicuuc.so.67()(64bit) or libicuuc.so.65()(64bit))
      - (libssl.so.3()(64bit) or libssl.so.1.1()(64bit))
      - libX11.so.6()(64bit)
      - libICE.so.6()(64bit)
      - libSM.so.6()(64bit)
      - libXcursor.so.1()(64bit)
      - libXext.so.6()(64bit)
      - libXfixes.so.3()(64bit)
      - libXi.so.6()(64bit)
      - libXrandr.so.2()(64bit)
      - libfontconfig.so.1()(64bit)
    recommends:
      - libGL.so.1()(64bit)
      - libEGL.so.1()(64bit)
      - libvulkan.so.1()(64bit)
      - libgtk-3.so.0()(64bit)
      - /usr/bin/pkexec
